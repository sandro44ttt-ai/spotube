name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9332338c067a2c5dafef3072a

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone compose-webview
        run: |
          git clone --depth 1 --branch fix/linux-wayland-input \
            "https://github.com/${COMPOSE_WEBVIEW_REPO}.git" compose-webview
          cd compose-webview && git rev-parse HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || true
          sdkmanager --install "ndk;28.2.13676358" || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux WebView build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libcairo2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleStableDebug --stacktrace

      - name: Show APK files
        run: find composeApp/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: spotube-apk
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14