name: Debug APK Build

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: false
        type: string
        default: spotify-theme

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          ndk-version: r26b

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g' -Dkotlin.native.enableKlibsCrossCompilation=false -Dkotlin.native.ignoreDisabledTargets=true"
        run: |
          ./gradlew :composeApp:assembleStableDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx6g"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/stable/debug/composeApp-stable-debug.apk
          retention-days: 7