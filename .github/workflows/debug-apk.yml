name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone compose-webview
        run: |
          git clone --depth 1 --branch fix/linux-wayland-input \
            "https://github.com/${COMPOSE_WEBVIEW_REPO}.git" compose-webview
          cd compose-webview && git rev-parse HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install "platforms;android-37" 2>&1 | tail -5 || true
          sdkmanager --install "build-tools;37.0.0" 2>&1 | tail -5 || true
          sdkmanager --install "ndk;28.2.13676358" 2>&1 | tail -5 || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The library's own verifyPublicationCoordinates fails off macOS (iOS targets
      # cannot be built here) and the desktop JNI backends are useless for an APK,
      # so skip both: only the Android + metadata publications are needed.
      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal \
            -x verifyPublicationCoordinates \
            -x buildNativeLinux \
            -x buildNativeMacos \
            -x buildNativeWindows \
            --stacktrace

      - name: Show Android SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"; ls -1 "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls -1 "$ANDROID_HOME/build-tools" || true
          echo "--- ndk ---"; ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleStableDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Report build errors
        if: failure()
        run: |
          echo "===== last 50 log lines ====="
          tail -50 apk-build.log || true
          echo "===== key errors ====="
          grep -nE "What went wrong|Caused by:|^e: |^FAILURE|Could not (find|resolve|determine)|error:|Failed to " apk-build.log | tail -25 || true
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "What went wrong|Caused by:|^e: |^FAILURE|Could not (find|resolve|determine)|Failed to " apk-build.log | tail -12) || true

      - name: Show APK files
        run: find composeApp/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: spotube-apk
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
